services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ai_e2e
      POSTGRES_PASSWORD: ai_e2e
      POSTGRES_DB: ai_e2e
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_e2e -d ai_e2e"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ai_e2e_pgdata:/var/lib/postgresql/data

volumes:
  ai_e2e_pgdata:

